function scheduleRent(project){
  const cfg=rent[project];
  if(!cfg.start||!cfg.annual)return[];

    const iso=d.toISOString().slice(0,10);
    out.push({id:`RENT-${project}-${iso}`,date:iso,amount:+cfg.annual*Math.pow(1+growth,year),year});
    d.setFullYear(d.getFullYear()+1);
    year++;
  }
  return out;
}
function simulateFundingMix(){
  const projectTotal=project=>TOTALS[project]+FEES[project];
  const due=(project,from,to)=>lines.filter(line=>line.project===project&&!line.label&&(!from||line.date>=from)&&(!to||line.date<to)).reduce((sum,line)=>sum+line.amount,0);
  const wg1Cheques=scheduleRent("WG1"),wg4Cheques=scheduleRent("WG4"),wg4Start=rent.WG4.start;
  const lastWg4Due=lines.filter(line=>line.project==="WG4"&&!line.label).reduce((latest,line)=>line.date>latest?line.date:latest,"");
  const wg1First=wg1Cheques[0],wg1Rent=wg1First?Math.min(wg1First.amount,due("WG1",wg1First.date)):0;
  const bridgeCheques=wg1Cheques.slice(1).filter(cheque=>wg4Start&&cheque.date<wg4Start);
  const bridgeStart=bridgeCheques[0]?.date;
  const bridgeAvailable=bridgeCheques.reduce((sum,cheque)=>sum+cheque.amount,0);
  const bridgeRent=bridgeStart?Math.min(bridgeAvailable,due("WG4",bridgeStart,wg4Start)):0;
  const snowballAvailable=[...wg1Cheques,...wg4Cheques].filter(cheque=>wg4Start&&cheque.date>=wg4Start&&cheque.date<=lastWg4Due).reduce((sum,cheque)=>sum+cheque.amount,0);
  const snowballRent=wg4Start?Math.min(snowballAvailable,due("WG4",wg4Start)):0;
  const result={WG1:{rent:wg1Rent},WG4:{rent:bridgeRent+snowballRent}};
  for(const project of ["WG1","WG4"]){
    result[project].total=projectTotal(project);
    result[project].pocket=Math.max(0,result[project].total-result[project].rent);
    result[project].rentPct=pct(result[project].rent,result[project].total);
    result[project].pocketPct=pct(result[project].pocket,result[project].total);
  }
  result.snowball=result.WG1.rentPct?pct(result.WG4.rentPct,result.WG1.rentPct)/100:0;
  return result;
}

function renderGoldenVisaMeter(){const value=(TOTALS.WG1+TOTALS.WG4)*AED_PER_EUR,progress=pct(value,GOLDEN_VISA_AED),scale=Math.max(100,Math.ceil(progress/5)*5),thresholdPosition=100/scale*100,fillPosition=Math.min(100,progress/scale*100),banner=app.querySelector(".visa-banner"),current=new Intl.NumberFormat("en-AE",{notation:"compact",maximumFractionDigits:2}).format(value);banner.className=`visa-banner meter ${progress>=100?"eligible":"pending"}`;banner.innerHTML=`<div class="visa-meter-head"><span><i class="visa-light" aria-hidden="true"></i>Golden Visa</span><strong>${progress>=100?"Eligible":"Not eligible"} · ${progress.toFixed(1)}%</strong></div><div class="visa-meter-track" role="progressbar" aria-label="Golden Visa threshold progress" aria-valuemin="0" aria-valuemax="${scale}" aria-valuenow="${progress.toFixed(1)}"><span class="visa-meter-fill" style="width:${fillPosition}%"></span>${progress>100?`<span class="visa-meter-overflow" style="left:${thresholdPosition}%;width:${fillPosition-thresholdPosition}%"></span>`:""}<i class="visa-threshold" style="left:${thresholdPosition}%"><small>AED 2M · 100%</small></i></div><div class="visa-meter-foot"><span>0</span><strong>AED ${current} · ${progress.toFixed(1)}%</strong></div>`}

}% covered by rent"><span style="width:${mix.pocketPct}%"></span><i style="width:${mix.rentPct}%"></i></div><div class="funding-row"><span>Out of pocket</span><strong>${money(mix.pocket,true)}</strong><em>${mix.pocketPct.toFixed(1)}%</em></div><div class="funding-row rent"><span>Covered by rent</span><strong>${money(mix.rent,true)}</strong><em>${mix.rentPct.toFixed(1)}%</em></div>${project==="WG4"?`<div class="snowball-badge">✦ Snowball effect · ${funding.snowball.toFixed(1)}× more rent-funded than WG1</div>`:""}</div></div>`};
  const sourceValues=Object.fromEntries(methods.map(method=>[method,lines.filter(l=>state[l.id]?.paid&&state[l.id]?.method===method).reduce((sum,l)=>sum+l.amount,0)]));

function renderTeslaHome(){
