<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1010" />
    <meta name="description" content="Mobile payment and rental tracker for the Weybridge Garden Dubai property portfolio." />
    <meta property="og:title" content="Leos Weybridge Garden Investment" />
    <meta property="og:description" content="WG1 & WG4 payment plan, market value and investment tracking." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Leos Weybridge Garden Investment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .visa-banner-wrap{padding:0 16px 3px}
      .visa-banner{display:flex;align-items:center;gap:9px;padding:10px 13px;border-radius:13px;font:500 12px Poppins,sans-serif}
      .visa-banner.eligible{color:var(--green);background:rgba(54,207,140,.11);border:1px solid rgba(54,207,140,.25)}
      .visa-banner.pending{color:var(--muted);background:var(--surface);border:1px solid var(--border)}
      .visa-banner strong{margin-left:auto;color:inherit;font-size:11px}
      .visa-light{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 11px currentColor}
      .visa-banner.meter{display:block;padding:6px 10px 5px;border-radius:10px}
      .visa-meter-head,.visa-meter-foot{display:flex;align-items:center;justify-content:space-between;gap:10px}
      .visa-meter-head>span{display:flex;align-items:center;gap:6px;font-size:10px}
      .visa-meter-head .visa-light{width:6px;height:6px;box-shadow:0 0 7px currentColor}
      .visa-meter-head strong{margin:0;font:500 9px Poppins,sans-serif;white-space:nowrap}
      .visa-meter-track{position:relative;height:4px;margin-top:12px;border-radius:999px;background:rgba(255,255,255,.1)}
      .visa-meter-fill,.visa-meter-overflow{position:absolute;left:0;top:0;height:100%;border-radius:inherit;background:rgba(110,215,165,.55)}
      .visa-meter-overflow{background:var(--green);box-shadow:0 0 12px rgba(110,215,165,.55)}
      .visa-threshold{position:absolute;top:-3px;width:1px;height:10px;background:var(--fg);transform:translateX(-1px)}
      .visa-threshold small{position:absolute;right:3px;bottom:7px;color:var(--muted);font:500 6px "JetBrains Mono",monospace;white-space:nowrap}
      .visa-meter-foot{display:none}
      .bottom-nav{grid-template-columns:repeat(5,1fr)}
      .bottom-nav small{font-size:8px}
      .dash-header h1{max-width:290px;font-size:32px;line-height:1.02}
      .dash-header .row{align-items:flex-start}
      .dash-header .chip{margin-top:21px}
      .dash-first{margin-top:12px}
      .dash-hero{padding:24px}
      .dash-arrow{font-size:22px}
      .resale-summary{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin-top:11px;padding:10px 12px;border-radius:13px;background:rgba(110,215,165,.07);border:1px solid rgba(110,215,165,.18)}
      .resale-summary span{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.1em}
      .resale-summary strong{font:500 13px "JetBrains Mono",monospace;color:var(--fg)}
      .resale-summary em{grid-column:1/-1;color:var(--green);font:500 9px "JetBrains Mono",monospace;font-style:normal}
      .dash-hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}
      .dash-hero-grid>div{padding:12px;background:rgba(255,255,255,.02);border-radius:14px}
      .dash-hero-grid strong{display:block;margin-top:7px;font-size:12px}
      .dash-net{display:grid;grid-template-columns:1fr auto;gap:5px 12px;align-items:center;margin:18px 0;color:var(--muted);font-size:11px;line-height:1.4}
      .dash-net strong{color:var(--fg)}
      .dash-net span:last-child{grid-column:2}
      .dash-progress-label{margin-top:4px}
      .dash-progress-label .mono{font-size:10px}
      .dash-track{height:8px;border-radius:99px;overflow:hidden;display:flex;background:#484d58;margin:10px 0 14px}
      .dash-track span{display:block;height:100%;background:var(--gold)}
      .dash-track i{display:block;height:100%;background:var(--cyan)}
      .dash-legend{display:grid;gap:8px}
      .dash-legend>div{display:grid;grid-template-columns:1fr auto 44px;align-items:center;gap:8px;color:var(--muted);font-size:10px}
      .dash-legend strong{color:var(--fg);font-weight:500}
      .dash-legend em{text-align:right;font-style:normal}
      .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px}
      .gold-dot{background:var(--gold)}.cyan-dot{background:var(--cyan)}.gray-dot{background:#555b67}
      .dash-metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
      .dash-metrics .card{padding:15px;min-height:116px}
      .dash-metrics span{display:block;color:var(--muted);font-size:9px;letter-spacing:.12em;text-transform:uppercase}
      .dash-metrics strong{display:block;font:400 25px Instrument Serif,serif;margin:13px 0 8px}
      .dash-metrics small{color:var(--muted);font-size:10px}
      .next-card{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center}
      .next-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:rgba(196,165,100,.14);color:var(--gold);font-size:22px}
      .next-card>div{min-width:0}
      .next-card .label{display:block;margin-bottom:6px}
      .next-card strong{display:inline-block;font:500 15px "JetBrains Mono",monospace;white-space:nowrap}
      .next-card small{margin-left:5px;color:var(--muted)}
      .next-card>span:last-child{white-space:nowrap;font-size:11px}
      .handover{border:1px solid rgba(255,255,255,.08);color:var(--fg);text-align:left;cursor:pointer}
      .handover span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.11em}
      .handover strong{display:block;margin:12px 0 8px;font:400 22px Instrument Serif,serif;color:var(--muted)}
      .handover em{color:var(--gold);font-size:11px;font-style:normal}
      .investor-mode{width:100%;text-align:left;border-color:rgba(239,214,110,.35);background:rgba(239,214,110,.04);cursor:pointer}
      .investor-mode b{display:block;color:var(--gold);font-size:14px;margin-bottom:7px}
      .investor-mode span{display:block;color:var(--muted);font-size:11px;line-height:1.5}
      .dash-property-stack{display:grid;gap:12px}
      .dash-property h2{margin:0;font:400 25px Instrument Serif,serif}
      .dash-property .row>strong{font-size:16px}
      .dash-property p{margin:5px 0 18px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
      .market-indicator{padding:14px;margin:0 0 17px;border:1px solid rgba(110,215,165,.22);border-radius:16px;background:rgba(110,215,165,.055)}
      .market-indicator .row{align-items:flex-start}
      .market-indicator>div:first-child strong{display:block;margin-top:6px;font:500 16px "JetBrains Mono",monospace}
      .market-update{border:1px solid rgba(110,215,165,.28);border-radius:999px;background:rgba(110,215,165,.08);color:var(--green);padding:6px 9px;font-size:9px;cursor:pointer}
      .market-gain{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid rgba(110,215,165,.16);font:500 11px "JetBrains Mono",monospace}
      .market-gain.positive{color:var(--green)}.market-gain.negative{color:var(--red)}
      .market-meta{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:8px;line-height:1.4}
      .market-meta span:last-child{text-align:right;white-space:nowrap}
      .market-source{margin:13px 0 0;color:var(--muted);font-size:9px;line-height:1.5}
      .resale-total{background:linear-gradient(145deg,rgba(110,215,165,.09),rgba(25,29,37,.92));border-color:rgba(110,215,165,.22)}
      .resale-total strong{display:block;margin-top:8px;font:400 36px Instrument Serif,serif}
      .resale-total p{margin:8px 0 0;color:var(--muted);font-size:11px}
      .resale-total p b{color:var(--fg);font-weight:500}
      .resale-table-wrap{padding:0;overflow-x:auto}
      .resale-table{width:100%;min-width:680px;border-collapse:collapse;font-size:10px}
      .resale-table th,.resale-table td{padding:14px 12px;border-bottom:1px solid var(--border);text-align:right;vertical-align:top;white-space:nowrap}
      .resale-table th{color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.08em;font-weight:500;background:rgba(255,255,255,.02)}
      .resale-table th:first-child,.resale-table td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
      .resale-table td{font-family:"JetBrains Mono",monospace}
      .resale-table td:first-child{min-width:190px;font-family:Inter,sans-serif}
      .resale-table td b{display:block;color:var(--fg);font-weight:500}
      .resale-table td small{display:block;margin-top:5px;color:var(--muted);font-size:8px;white-space:normal;line-height:1.4}
      .resale-table td button{margin-top:9px;border:0;background:none;color:var(--gold);font-size:8px;padding:0;cursor:pointer}
      .resale-table .positive{color:var(--green)}.resale-table .negative{color:var(--red)}
      .resale-table .total-row td{border-bottom:0;background:rgba(110,215,165,.055);font-weight:500}
      .resale-table .total-row td:first-child{background:color-mix(in srgb,var(--surface) 94%,var(--green))}
      .resale-card-stack{display:grid;gap:12px}
      .resale-property-card{min-width:0}
      .resale-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border)}
      .resale-card-head>div{min-width:0}
      .resale-card-head h2{margin:0;font:400 25px Instrument Serif,serif}
      .resale-card-head p{margin:5px 0 0;color:var(--muted);font-size:9px;line-height:1.4}
      .resale-card-head button{flex:none;border:1px solid var(--border);border-radius:999px;background:var(--surface2);color:var(--gold);padding:7px 9px;font-size:9px;cursor:pointer}
      .resale-card-head>span{color:var(--muted);font-size:9px;white-space:nowrap}
      .resale-values{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:14px}
      .resale-values>div{min-width:0;padding:11px;border-radius:13px;background:rgba(255,255,255,.03)}
      .resale-values span{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.08em}
      .resale-values strong{display:block;margin-top:7px;font:500 11px "JetBrains Mono",monospace;white-space:normal;overflow-wrap:anywhere}
      .resale-values .positive{color:var(--green)}.resale-values .negative{color:var(--red)}
      .resale-updated{display:block;margin-top:12px;color:var(--muted);font-size:8px}
      .resale-portfolio-total{border-color:rgba(110,215,165,.25);background:linear-gradient(145deg,rgba(110,215,165,.075),rgba(25,29,37,.92))}
      @media(max-width:340px){.resale-card-head{display:grid}.resale-card-head button{justify-self:start}.resale-values{grid-template-columns:1fr}}
      .dash-split{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:15px}
      .dash-split>div{min-width:0}
      .dash-split span{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
      .dash-split strong{display:block;margin-top:8px;font:500 10px "JetBrains Mono",monospace;white-space:nowrap}
      .dash-split small{display:block;margin-top:4px;color:var(--muted);font:400 9px "JetBrains Mono",monospace}
      .dash-yields{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--border);margin-top:17px;padding-top:15px}
      .dash-yields span{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.08em}
      .dash-yields strong{display:block;margin-top:8px;font-size:12px;font-weight:500}
      .snowball-summary{padding:18px 20px;border:1px solid rgba(196,165,100,.36);background:linear-gradient(125deg,rgba(196,165,100,.11),rgba(23,23,23,.96));border-radius:0 0 34px 0}
      .snowball-summary>strong{display:flex;align-items:center;gap:12px;margin-top:8px;font:500 24px "JetBrains Mono",monospace;color:var(--gold)}
      .snowball-summary>strong i{font-style:normal;color:var(--fg);font-size:16px}
      .snowball-summary p{margin:7px 0 0;color:var(--muted);font-size:10px;line-height:1.45}
      .funding-forecast{margin-top:17px;padding-top:16px;border-top:1px solid var(--border)}
      .funding-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
      .funding-head .label,.funding-head small{display:block}
      .funding-head small{margin-top:5px;color:var(--muted);font-size:8px}
      .funding-head>strong{color:var(--gold);font:500 11px "JetBrains Mono",monospace;white-space:nowrap}
      .funding-bar{display:flex;height:7px;overflow:hidden;border-radius:99px;background:var(--surface2);margin:13px 0 9px}
      .funding-bar span{height:100%;background:var(--gold)}
      .funding-bar i{height:100%;background:#e7dcc3}
      .funding-row{display:grid;grid-template-columns:1fr auto 45px;align-items:center;gap:8px;padding:5px 0;color:var(--muted);font-size:9px}
      .funding-row strong,.funding-row em{font:500 9px "JetBrains Mono",monospace;color:var(--fg);font-style:normal;text-align:right}
      .funding-row.rent span,.funding-row.rent em{color:#e7dcc3}
      .snowball-badge{margin-top:10px;padding:9px 10px;border:1px solid rgba(196,165,100,.28);background:rgba(196,165,100,.07);color:var(--gold);font-size:8px;line-height:1.45;text-transform:uppercase;letter-spacing:.06em}
      .source-card{padding:20px}
      .source-bar{display:flex;height:9px;overflow:hidden;border-radius:99px;background:var(--surface2);margin-bottom:17px}
      .source-bar span{height:100%}.source-bar .salary,.source-dot.salary{background:var(--green)}.source-bar .crypto,.source-dot.crypto{background:var(--orange)}.source-bar .morocco,.source-dot.morocco{background:var(--red)}.source-bar .salesforce,.source-dot.salesforce{background:#669df6}.source-bar .rent,.source-dot.rent{background:var(--cyan)}
      .source-row{display:grid;grid-template-columns:1fr auto 54px;gap:10px;align-items:center;padding:7px 0;font-size:11px}
      .source-name{display:flex;align-items:center}.source-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:10px}.source-dot.unassigned{background:#555b67}
      .source-row strong{text-align:right;font-weight:500}.source-note{color:var(--muted);font-size:10px;line-height:1.4}
      @media(max-width:390px){.next-card{grid-template-columns:auto 1fr}.next-card>span:last-child{grid-column:2;color:var(--muted);font-size:9px}.next-card small{display:block;margin:4px 0 0}}
      @media(max-width:360px){.dash-header h1{font-size:28px;max-width:240px}.dash-hero{padding:19px}.dash-split span{font-size:7px}.dash-split strong{font-size:9px}}

      /* LEOS Developments-inspired visual system */
      :root{
        --bg:#101010;
        --surface:#171717;
        --surface2:#202020;
        --fg:#fff;
        --muted:#99958e;
        --border:#34312c;
        --gold:#c4a564;
        --cyan:#d8c28f;
        --green:#78b991;
        --orange:#c89155;
        --red:#c97970;
        --radius:0;
        color-scheme:dark
      }
      html{background:#090909}
      body{
        font-family:Poppins,Arial,sans-serif;
        background:#090909
      }
      .app-frame{
        background:
          linear-gradient(90deg,transparent 0 92%,rgba(196,165,100,.045) 92% 100%),
          var(--bg)
      }
      .app-frame:before{
        content:"";
        position:absolute;
        z-index:0;
        top:34px;
        right:0;
        width:1px;
        height:180px;
        background:var(--gold);
        opacity:.65;
        pointer-events:none
      }
      .status-bar,.shell,.bottom-nav{position:relative}
      .status-bar{font-family:Poppins,Arial,sans-serif;font-weight:500}
      .shell{padding-bottom:112px}
      .header{padding:22px 24px 20px}
      .eyebrow,.label,.section-title,
      .dash-metrics span,.handover span,.dash-property p,
      .dash-split span,.dash-yields span,.resale-values span,
      .form-field span,.payment-head{
        font-family:Poppins,Arial,sans-serif;
        font-weight:400;
        letter-spacing:.2em
      }
      .eyebrow{color:var(--gold);font-size:9px}
      .eyebrow:before{
        content:"LEOS";
        display:inline-grid;
        place-items:center;
        min-width:42px;
        height:19px;
        margin-right:3px;
        border:1px solid var(--gold);
        color:#fff;
        font-size:8px;
        font-weight:600;
        letter-spacing:.16em
      }
      .header h1,.dash-header h1{
        max-width:310px;
        margin-top:12px;
        font:300 31px/1.16 Poppins,Arial,sans-serif;
        letter-spacing:-.04em
      }
      .header p:not(.eyebrow){max-width:330px;color:#aaa69f;font-size:11px;font-weight:300}
      .dash-header .chip{margin-top:26px}
      .section{margin-top:18px}
      .section-title{margin-bottom:11px;color:#aaa69f}
      .card,.table-wrap,.rent-line{
        border:1px solid var(--border);
        border-radius:30px 0 30px 0;
        background:var(--surface);
        box-shadow:none
      }
      .hero:after{
        width:110px;
        height:1px;
        top:24px;
        right:-35px;
        border-radius:0;
        background:var(--gold);
        filter:none;
        transform:rotate(-45deg)
      }
      .dash-first{margin-top:7px}
      .dash-hero{padding:25px 22px}
      .big-number,.dash-metrics strong,.handover strong,
      .dash-property h2,.resale-card-head h2,.resale-total strong{
        font-family:Poppins,Arial,sans-serif;
        font-weight:300;
        letter-spacing:-.045em
      }
      .big-number{font-size:35px}
      .mono,.mini strong,.next-card strong,.market-indicator>div:first-child strong,
      .market-gain,.resale-values strong,.dash-split strong,.dash-split small,
      .form-field input,.amount,.month,.rent-line em{
        font-family:"JetBrains Mono",monospace
      }
      .dash-hero-grid>div,.mini,.kpi,.resale-values>div{
        border:1px solid #2d2a26;
        border-radius:16px 0 16px 0;
        background:#1d1d1d
      }
      .dash-track,.progress,.source-bar{height:6px;border-radius:0;background:#2b2b2b}
      .dash-track span,.progress span{background:var(--gold)}
      .dash-track i{background:#eee4ce}
      .dot,.source-dot,.legend i{border-radius:0}
      .resale-summary,.market-indicator{
        border-color:rgba(196,165,100,.28);
        border-radius:18px 0 18px 0;
        background:rgba(196,165,100,.07)
      }
      .resale-summary em,.market-gain.positive,.resale-values .positive,
      .resale-table .positive{color:var(--gold)}
      .market-update,.chip,.btn{
        border-radius:0;
        border-color:#4a4336;
        background:transparent;
        color:var(--gold);
        text-transform:uppercase;
        letter-spacing:.1em
      }
      .chip.active,.btn.primary{
        border-color:var(--gold);
        background:var(--gold);
        color:#111
      }
      .next-icon{
        border:1px solid rgba(196,165,100,.42);
        border-radius:18px 0 18px 0;
        background:rgba(196,165,100,.1)
      }
      .handover{border-color:#3b3730}
      .investor-mode{
        border-color:rgba(196,165,100,.5);
        background:linear-gradient(110deg,rgba(196,165,100,.1),transparent 66%)
      }
      .investor-mode b,.handover em,.resale-card-head button{color:var(--gold)}
      .source-bar .salary,.source-dot.salary{background:#75aa86}
      .source-bar .crypto,.source-dot.crypto{background:#d7b06d}
      .source-bar .morocco,.source-dot.morocco{background:#9f6d64}
      .source-bar .salesforce,.source-dot.salesforce{background:#c4a564}
      .source-bar .rent,.source-dot.rent{background:#e7dcc3}
      .visa-banner.meter{
        padding:7px 10px 6px;
        border-radius:0;
        border-color:rgba(120,185,145,.38);
        background:#151a16
      }
      .visa-banner.meter .visa-meter-track{border-radius:0;background:#292e2a}
      .visa-meter-fill,.visa-meter-overflow{border-radius:0}
      .visa-meter-overflow{box-shadow:none}
      .resale-total,.resale-portfolio-total{
        border-color:rgba(196,165,100,.38);
        background:linear-gradient(125deg,rgba(196,165,100,.12),#171717 58%)
      }
      .table-wrap{background:var(--surface)}
      .payment-head{background:#1d1d1d}
      .payment-row{border-bottom-color:#2d2b27}
      .pay-cell{border-left-color:#2d2b27}
      .check{border-radius:0}
      .check.paid,.pay-cell.wg1 .check.paid{background:var(--gold);border-color:var(--gold)}
      .form-field{border-radius:16px 0 16px 0;background:#1d1d1d;border-color:#302d28}
      .rent-line{border-radius:22px 0 22px 0}
      .sheet{
        border-radius:34px 0 0 0;
        border-color:#4b4335;
        background:#171717
      }
      .method-grid button{border-radius:14px 0 14px 0;background:#202020}
      .bottom-nav{
        gap:1px;
        padding:5px;
        border:1px solid #403a31;
        border-radius:24px 0 24px 0;
        background:rgba(15,15,15,.96);
        box-shadow:0 16px 45px rgba(0,0,0,.5)
      }
      .bottom-nav button{min-height:50px;border-radius:17px 0 17px 0}
      .bottom-nav small{font-family:Poppins,Arial,sans-serif;font-size:7px;text-transform:uppercase;letter-spacing:.04em}
      .bottom-nav button.active{
        background:var(--gold);
        color:#111;
        box-shadow:none
      }
      @media(min-width:700px){
        body{background:#090909}
        .app-frame{border-color:#3a342b;border-radius:34px 0 34px 0;box-shadow:0 34px 100px rgba(0,0,0,.65)}
      }
      .rent-note{margin:13px 0 0;color:var(--muted);font-size:9px;line-height:1.55}
      .rent-phases{display:grid;gap:9px}
      .rent-phase{padding:16px 18px}
      .rent-phase strong{display:block;margin-top:10px;font:500 17px "JetBrains Mono",monospace;color:var(--gold)}
      .rent-phase p{margin:7px 0 3px;font-size:11px;color:var(--fg)}
      .rent-phase small{display:block;color:var(--muted);font-size:9px;line-height:1.45}
      .rent-cheque-copy{min-width:0;flex:1}
      .rent-cheque-copy strong{display:block}
      .rent-cheque-copy small{display:block;margin-top:3px;color:var(--muted);font-size:8px}
      .rent-line em{flex:none}
      .bottom-nav{
        position:fixed;
        bottom:0;
        width:min(100%,440px);
        padding:5px 5px max(5px,env(safe-area-inset-bottom));
        border-width:1px 0 0;
        border-radius:24px 0 0 0;
        box-shadow:0 -12px 34px rgba(0,0,0,.42)
      }
      @media(min-width:700px){.bottom-nav{bottom:22px;width:440px}}
    </style>
  </head>
